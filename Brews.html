<!DOCTYPE html>
<html>
<head>
  <title>Monthly Feedback Form</title>
  <style>
    #formContainer {
      position: fixed;
      bottom: 60px;
      right: 20px;
      width: 450px;
      height: 550px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      z-index: 9999;
      display: none;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    #toggleBtn {
      position: fixed;
      bottom: 10px;
      right: 20px;
      background-color: #D1A33C;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10000;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<!-- Container for the Google Form -->
<div id="formContainer">
  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd5UiUaEBrxEwtesaYHGpgskoowphxzrVHLUn8nj-qldJqf7Q/viewform?embedded=true" allowfullscreen></iframe>
</div>

<!-- Toggle Button -->
<button id="toggleBtn">Feedback</button>

<script>
  const today = new Date();
  const lastSubmitDate = localStorage.getItem("lastSubmitDate");

  // Show form only if month has changed
  const showForm = !lastSubmitDate || new Date(lastSubmitDate).getMonth() !== today.getMonth();

  if (showForm) {
    document.getElementById("formContainer").style.display = "block";
  }

  // Toggle form visibility
  document.getElementById("toggleBtn").onclick = function () {
    const formBox = document.getElementById("formContainer");
    formBox.style.display = (formBox.style.display === "none") ? "block" : "none";
  };

  // Detect form submission (manual close simulation)
  window.addEventListener("message", (event) => {
    if (event.data === "formSubmitted") {
      localStorage.setItem("lastSubmitDate", today.toISOString());
      document.getElementById("formContainer").style.display = "none";
    }
  });

  // Optionally auto-set date after x mins assuming form is submitted
  setTimeout(() => {
    if (showForm) {
      localStorage.setItem("lastSubmitDate", today.toISOString());
      document.getElementById("formContainer").style.display = "none";
    }
  }, 180000); // 3 mins
</script>

</body>
</html>
