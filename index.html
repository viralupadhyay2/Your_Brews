<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback Form</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #formContainer {
      position: fixed;
      bottom: 60px;
      right: 20px;
      width: 400px;
      height: 550px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      z-index: 9999;
      display: block; /* ✅ Always show on load */
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    #toggleBtn {
      position: fixed;
      bottom: 10px;
      right: 20px;
      background-color: #D1A33C;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10000;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<!-- Feedback Form Container -->
<div id="formContainer">
  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd5UiUaEBrxEwtesaYHGpgskoowphxzrVHLUn8nj-qldJqf7Q/viewform?embedded=true" allowfullscreen></iframe>
</div>

<!-- Toggle Button -->
<button id="toggleBtn">Feedback</button>

<!-- Toggle Logic Only (No hide logic) -->
<script>
  document.getElementById("toggleBtn").onclick = function () {
    const formBox = document.getElementById("formContainer");
    formBox.style.display = (formBox.style.display === "none") ? "block" : "none";
  };
</script>

</body>
</html>
